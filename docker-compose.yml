version: "3.8"

services:
  # Ubuntu 20.04 matrix
  build-u20-p310:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UBUNTU_VERSION: "20.04"
    volumes:
      - .:/app
    environment:
      - TERM=xterm
      - PY_VER=3.10
    command: >
      bash -c "/bin/bash /app/docker_runner.bash > /app/dist_logs/u20_p310.log 2>&1"

  build-u20-p311:
