[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g2opy"
version = "2.1.0"
description = "g2o: A General Framework for Graph Optimization (Python bindings)"
readme = "README.md"
authors = [{ name = "Maintainers" }]
requires-python = ">=3.10"
# If you publish, add classifiers, license, urls, etc.

[tool.setuptools]
# Our Python package lives under ./python
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["g2opy*"]

# Include compiled extensions as package data so the wheel contains them
[tool.setuptools.package-data]
g2opy = [
  "**/*.so", "**/*.pyd", "**/*.dll", "**/*.dylib",  # binary extensions
  "**/*.pyi"                                         # (optional) type stubs
]

# If you need to include non-code files too:
# [tool.setuptools.include-package-data]
# value = true

